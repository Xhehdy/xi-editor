[package]
name = "cortex-llm"
version = "0.1.0"
edition = "2021"
description = "LLM interface for Cortex IDE (talks to sidecar)"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
