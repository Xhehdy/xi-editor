[workspace]
resolver = "2"

members = [
    "crates/cortex-rope",
    "crates/cortex-buffer",
    "crates/cortex-patch",
    "crates/cortex-events",
    "crates/cortex-protocol",
    "crates/cortex-scheduler",
    "crates/cortex-syntax",
    "crates/cortex-agents",
    "crates/cortex-intent",
    "crates/cortex-ce",
    "crates/cortex-graph",
    "crates/cortex-vectors",
    "crates/cortex-llm",
    "crates/cortex-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/your-org/cortex"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"  # MessagePack

# Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Text processing (from xi-rope deps, updated)
bytecount = "0.6"
memchr = "2.7"
regex = "1.10"
unicode-segmentation = "1.10"

# WASM runtime (for agents - Phase 2)
# wasmtime = "16.0"
