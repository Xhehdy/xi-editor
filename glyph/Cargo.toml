[workspace]
resolver = "2"

members = [
    "crates/glyph-rope",
    "crates/glyph-buffer",
    "crates/glyph-patch",
    "crates/glyph-events",
    "crates/glyph-protocol",
    "crates/glyph-scheduler",
    "crates/glyph-syntax",
    "crates/glyph-agents",
    "crates/glyph-intent",
    "crates/glyph-ce",
    "crates/glyph-graph",
    "crates/glyph-vectors",
    "crates/glyph-llm",
    "crates/glyph-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/your-org/glyph"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"  # MessagePack

# Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Text processing (from xi-rope deps, updated)
bytecount = "0.6"
memchr = "2.7"
regex = "1.10"
unicode-segmentation = "1.10"

# WASM runtime (for agents - Phase 2)
# wasmtime = "16.0"
