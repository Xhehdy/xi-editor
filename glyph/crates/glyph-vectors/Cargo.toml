[package]
name = "glyph-vectors"
version = "0.1.0"
edition = "2021"
description = "Vector store abstraction for semantic search (Pinecone, Qdrant, etc.)"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tracing = "0.1"
